[project]
name = "dsci-522-group-41-Mortality-In-Heart-Failure-Patients"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "altair==6.3.0",
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "nbclient==0.11.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "plotly==7.1.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
]

[dependency-groups]
dev = [
    "jupyter==1.1.1",
]

[tool.uv]
# `uv add` writes ad exact version (==)
add-bounds = "exact"